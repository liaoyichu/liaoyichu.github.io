<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Mario</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #5c94fc;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #5c94fc;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        #controls {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 100;
        }
        .btn {
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: white;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #d-pad {
            display: flex;
            gap: 10px;
        }
        #action-pad {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            color: black;
            font-weight: bold;
            z-index: 200;
        }
    </style>
</head>
<body>
    <a href="/" id="home-btn">🏠 返回基地</a>
    <div id="version-tag" style="position:fixed;top:60px;left:20px;color:white;font-size:12px;opacity:0.5;">v2.8 (HP + Medkit)</div>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="controls">
            <div id="d-pad">
                <div class="btn" id="leftBtn">←</div>
                <div class="btn" id="rightBtn">→</div>
            </div>
            <div id="action-pad">
                <div class="btn" id="attackBtn" style="background:rgba(255,120,120,0.7);font-size:22px;">⚔</div>
                <div class="btn" id="critBtn" style="background:rgba(255,215,64,0.8);font-size:20px;">💥</div>
                <div class="btn" id="jumpBtn">↑</div>
            </div>
        </div>
    </div>
    <script src="game.js?v=20260217_v20"></script>
</body>
</html>
