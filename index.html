<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初初的基地</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #2c3e50; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        .header { padding: 40px 0; background: linear-gradient(135deg, #2c3e50, #4ca1af); color: white; border-radius: 15px; margin-bottom: 20px; }
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nav-item { background: white; padding: 25px; border-radius: 12px; text-decoration: none; color: inherit; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .nav-item:active { transform: scale(0.95); }
        .icon { font-size: 40px; margin-bottom: 10px; display: block; }
        .label { font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 初初的基地</h1>
            <p>学习、游戏、探索，都在这里！</p>
        </div>
        <div class="nav-grid">
            <a href="/games/mario/" class="nav-item">
                <span class="icon">🎮</span>
                <span class="label">像素闯关</span>
            </a>
            <a href="https://liaoyichu.github.io/weiweigame/" class="nav-item">
                <span class="icon">🧱</span>
                <span class="label">围围游戏</span>
            </a>
            <a href="/study/math/" class="nav-item">
                <span class="icon">📐</span>
                <span class="label">数学实验室</span>
            </a>
            <a href="#" class="nav-item" style="opacity: 0.5;">
                <span class="icon">🏮</span>
                <span class="label">语文（建设中）</span>
            </a>
            <a href="#" class="nav-item" style="opacity: 0.5;">
                <span class="icon">🔤</span>
                <span class="label">英语（建设中）</span>
            </a>
        </div>
    </div>
</body>
</html>
