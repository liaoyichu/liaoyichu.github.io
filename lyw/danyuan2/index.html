<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二年级数学（上）第二单元 · 错题勾选</title>
<style>
  :root{ --ink:#141414; --sub:#666; --line:#dfe3e8; --navy:#1f3a52; --gold:#ffd166; --red:#d92b2b; --warn:#c96a00; }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:"PingFang SC","Hiragino Sans GB","Songti SC",sans-serif;background:#f2f4f7;color:var(--ink);font-size:16px;line-height:1.55}

  /* ---------- 顶部条 ---------- */
  .bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 16px 10px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .bar h1{margin:0 0 6px;font-size:17px;font-weight:600}
  .bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar button{font-size:14.5px;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;font-weight:600;background:var(--gold);color:var(--navy)}
  .bar button.ghost{background:transparent;color:#c9d6e2;border:1px solid #4a6b8a;font-weight:400}
  #cnt{font-size:14.5px;color:#c9d6e2}
  #out{margin-top:7px;font-size:18px;color:#ffe9a8;line-height:1.5;min-height:26px;word-break:break-all}
  #out b{color:#fff}

  /* ---------- 题目列表 ---------- */
  .wrap{max-width:960px;margin:0 auto;padding:14px 14px 110px}
  .hint{color:#556;font-size:14px;margin:0 0 12px}
  .sec{margin:18px 0 8px;font-size:17px;font-weight:600;color:var(--navy);border-left:5px solid var(--navy);padding-left:10px;display:flex;gap:10px;align-items:center}
  .sec .pickAll{font-size:13px;font-weight:400;color:#0a58ca;text-decoration:underline;cursor:pointer}
  .item{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .item:hover{border-color:#9ab}
  .item.on{border-color:#1a7f37;background:#f2fbf4;box-shadow:0 0 0 2px rgba(26,127,55,.15)}
  .box{flex:0 0 22px;width:22px;height:22px;border:1.6px solid #99a3ad;border-radius:5px;margin-top:2px;position:relative;background:#fff}
  .item.on .box{background:#1a7f37;border-color:#1a7f37}
  .item.on .box::after{content:"";position:absolute;left:6px;top:2px;width:7px;height:13px;border:2.5px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
  .no{flex:0 0 auto;font-weight:700;color:var(--navy);font-size:15px;min-width:34px;padding-top:1px}
  .sum{flex:1 1 auto;font-size:15px;color:#222}
  .sum .preview{display:block;margin-top:6px;max-width:100%;height:auto;border:1px solid #eee;border-radius:4px}

  /* ---------- 底部主按钮 ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:9px 14px 12px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(6px)}
  .dock .big{flex:1 1 auto;font-size:17px;font-weight:700;padding:13px;border:none;border-radius:9px;background:#1a7f37;color:#fff;cursor:pointer}
  .dock .big:disabled{background:#b8c2cc;cursor:not-allowed}

  /* ---------- 生成的错题卷 ---------- */
  .paper{display:none;background:#fff;max-width:210mm;margin:0 auto;padding:14mm 13mm 18mm}
  .paper h2{font-size:20pt;text-align:center;margin:0 0 2mm;font-weight:600;letter-spacing:1px}
  .paper .psub{text-align:center;font-size:11pt;color:var(--sub);margin:0 0 5mm}
  .meta{display:flex;justify-content:space-between;font-size:12pt;border-bottom:1.2px solid var(--ink);padding-bottom:2mm;margin-bottom:5mm}
  .psec{font-size:15pt;font-weight:600;margin:7mm 0 3mm;border-left:5px solid var(--navy);padding-left:3mm;color:var(--navy);page-break-after:avoid;break-after:avoid}
  .pitem{page-break-inside:avoid;break-inside:avoid;margin:0 0 6mm}
  .pq{font-size:14.5pt;line-height:1.85}
  .pqno{font-weight:700}
  .pfig{display:block;margin:2.5mm 0 1mm}
  .pfig img{display:block;max-width:100%}
  .blank{min-height:9mm;border-bottom:1px dotted #bbb;margin:2mm 0}
  .work{border:1px dashed #c8ced4;border-radius:3mm;margin-top:2.5mm;
        background:repeating-linear-gradient(to bottom,transparent 0 7.5mm,#eef1f4 7.5mm 7.6mm)}
  .work.sm{height:22mm} .work.md{height:34mm} .work.lg{height:52mm}
  .draw{border:1px dashed #c8ced4;border-radius:3mm;height:26mm;margin-top:2.5mm}
  .ansblock{margin-top:2.5mm;padding:2.5mm 3mm;background:#fff7f7;border-left:3px solid var(--red);font-size:12.5pt;line-height:1.7;page-break-inside:avoid}
  .ansblock b{color:var(--red)}
  .ansblock .tip{color:var(--warn);font-size:11.5pt}
  .empty{color:var(--sub);text-align:center;padding:30mm 0;font-size:14pt}

  @page{ size:A4; margin:0 }
  @media print{
    body{background:#fff}
    .bar,.dock,.wrap,.noprint{display:none !important}
    .paper{display:block !important;padding:0;margin:0;max-width:none}
  }
  @media (max-width:560px){
    .sum{font-size:14.5px}
    #out{font-size:16px}
  }
</style>
</head>
<body>

<div class="bar">
  <h1>二年级数学（上）第二单元 · 错题勾选</h1>
  <div class="row">
    <button class="ghost" onclick="clearAll()">全部清空</button>
    <button class="ghost" onclick="copyList()">复制题号</button>
    <button class="ghost" id="ansBtn" onclick="toggleAns()">重做卷带答案：关</button>
    <span id="cnt">已选 0 题</span>
  </div>
  <div id="out">点题目卡片勾选出错的那几道，下面会显示题号。</div>
</div>

<div class="wrap" id="pickView">
  <p class="hint">这套卷子共 <b>30 道</b>（按小题分）。对着孩子做过的卷子点一遍，勾完在下面点「生成错题重做卷」，就能打印成一张张 A4 给孩子重做；想连答案一起印，就打开上面的「重做卷带答案」。</p>
  <div id="list"></div>
</div>

<div class="paper" id="paperView">
  <div class="noprint" style="text-align:center;margin-bottom:10px">
    <button onclick="backToPick()" style="font-size:15px;padding:9px 16px;border:none;border-radius:8px;background:#1f3a52;color:#fff;cursor:pointer">← 返回继续勾选</button>
    <button onclick="window.print()" style="font-size:15px;padding:9px 16px;border:none;border-radius:8px;background:#1a7f37;color:#fff;cursor:pointer">打印 / 存成 PDF</button>
    <span style="color:#666;font-size:13px;display:block;margin-top:6px">手机上：点「打印」后选「存储为 PDF」即可保存。</span>
  </div>
  <div id="paperBody"></div>
</div>

<div class="dock noprint">
  <span style="font-size:14px;color:#556" id="dockCnt">还没勾选</span>
  <button class="big" id="mkBtn" onclick="makePaper()" disabled>生成错题重做卷</button>
</div>
<p class="noprint" style="text-align:center;color:#667;font-size:13px;margin:6px 14px 90px">

</p>

/* ---------- 渲染勾选列表 ---------- */
function renderList(){
  var secs = [], map = {};
  QS.forEach(function(q){
    if(!map[q.sec]){ map[q.sec]=[]; secs.push(q.sec); }
    map[q.sec].push(q);
  });
  var html = '';
  secs.forEach(function(s){
    html += '<div class="sec">'+s+'<span class="pickAll" data-sec="'+s+'">全选本大题</span></div>';
    map[s].forEach(function(q){
      html += '<div class="item" data-id="'+q.id+'" data-sec="'+s+'">'
            +   '<div class="box"></div>'
            +   '<div class="no">'+q.id+'</div>'
            +   '<div class="sum">'+q.sum
            +     (q.fig ? '<img class="preview" src="'+q.fig[0]+'" style="max-width:min(100%,'+(parseInt(q.fig[1])*3.4)+'px)">' : '')
            +   '</div>'
            + '</div>';
    });
  });
  document.getElementById('list').innerHTML = html;
  document.querySelectorAll('.item').forEach(function(el){
    el.addEventListener('click', function(){ toggle(el.dataset.id); });
  });
  document.querySelectorAll('.pickAll').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); pickSection(el.dataset.sec); });
  });
}
function pickSection(sec){
  var ids = QS.filter(function(q){return q.sec===sec}).map(function(q){return q.id});
  var allOn = ids.every(function(id){return selected.indexOf(id)>=0});
  ids.forEach(function(id){
    var i = selected.indexOf(id);
    if(allOn){ if(i>=0) selected.splice(i,1); }
    else if(i<0) selected.push(id);
  });
  sync();
}
var selected = [];
function toggle(id){
  var i = selected.indexOf(id);
  if(i>=0) selected.splice(i,1); else selected.push(id);
  sync();
}
function clearAll(){ selected = []; sync(); }

function order(list){   // 按卷子顺序排
  return QS.filter(function(q){ return list.indexOf(q.id)>=0; });
}
function sync(){
  document.querySelectorAll('.item').forEach(function(el){
    el.classList.toggle('on', selected.indexOf(el.dataset.id)>=0);
  });
  document.getElementById('cnt').textContent = '已选 ' + selected.length + ' 题';
  document.getElementById('dockCnt').textContent = selected.length ? ('已选 ' + selected.length + ' 题') : '还没勾选';
  document.getElementById('mkBtn').disabled = selected.length===0;
  document.getElementById('out').innerHTML = selected.length
    ? '<b>' + order(selected).map(function(q){return q.id}).join('、') + '</b>'
    : '点题目卡片勾选出错的那几道，下面会显示题号。';
  try{ localStorage.setItem(KEY, JSON.stringify(selected)); }catch(e){}
}
function load(){
  try{
    var v = JSON.parse(localStorage.getItem(KEY) || '[]');
    if(Object.prototype.toString.call(v)==='[object Array]'){
      selected = v.filter(function(id){ return QS.some(function(q){return q.id===id}); });
    }
  }catch(e){}
}

/* ---------- 生成错题重做卷 ---------- */
function makePaper(){
  var items = order(selected);
  if(!items.length) return;
  var body = '<h2>二年级数学（上）· 第二单元错题重做</h2>'
    + '<p class="psub">精选 ' + items.length + ' 题' + (withAns ? '（含答案）' : '') + '</p>'
    + '<div class="meta"><span>姓名：____________</span><span>日期：____________</span><span>用时：________</span></div>';
  var curSec = '';
  items.forEach(function(q){
    if(q.sec !== curSec){ curSec = q.sec; body += '<div class="psec">'+q.sec+'</div>'; }
    body += '<div class="pitem"><div class="pq"><span class="pqno">'+q.id+'.</span> '+q.q+'</div>';
    if(q.fig) body += '<div class="pfig"><img src="'+q.fig[0]+'" style="width:'+q.fig[1]+'"></div>';
    if(q.h==='draw') body += '<div class="draw"></div>';
    else if(q.h) body += '<div class="work '+q.h+'"></div>';
    if(withAns) body += '<div class="ansblock"><div>答案：'+q.ans+'</div>'
                      + (q.tip ? '<div class="tip">易错：'+q.tip+'</div>' : '') + '</div>';
    body += '</div>';
  });
  document.getElementById('paperBody').innerHTML = body;
  document.getElementById('pickView').style.display = 'none';
  document.querySelector('.bar').style.display = 'none';
  document.querySelector('.dock').style.display = 'none';
  document.getElementById('paperView').style.display = 'block';
  window.scrollTo(0,0);
}
function backToPick(){
  document.getElementById('paperView').style.display = 'none';
  document.getElementById('pickView').style.display = 'block';
  document.querySelector('.bar').style.display = '';
  document.querySelector('.dock').style.display = '';
  window.scrollTo(0,0);
}
function toggleAns(){
  withAns = !withAns;
  document.getElementById('ansBtn').textContent = '重做卷带答案：' + (withAns ? '开' : '关');
  if(document.getElementById('paperView').style.display === 'block') makePaper();
}
function copyList(){
  var txt = '第二单元卷 错题：' + (selected.length ? order(selected).map(function(q){return q.id}).join('、') : '（还没勾选）');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ alert('已复制：\n' + txt); },
      function(){ prompt('复制下面这行：', txt); });
  } else { prompt('复制下面这行：', txt); }
}

renderList(); load(); sync();
</script>
