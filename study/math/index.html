        let notes = realNotes;

        function showDetail(id) {
            const note = notes.find(n => n.id === id);
            document.getElementById('detail-content').innerHTML = `
                <div class=\"detail-card\">
                    <div style=\"color:#a0aec0; font-size:12px; margin-bottom:10px;\">📅 ${note.date} | #ID: ${note.id}</div>
                    <h2 style=\"margin-top:0;\">${note.title}</h2>
                    <div class=\"question-box\"><b>原题描述：</b><br>${note.question}</div>
                    ${note.steps.map(s => `<div class=\"step-item\"><b>${s.title}</b><p>${s.content}</p></div>`).join('')}
                    <div class=\"conclusion-box\">🎯 最终结论：${note.conclusion}</div>
                </div>
            `;
            document.getElementById('grid-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            window.scrollTo(0,0);
            if (window.MathJax) window.MathJax.typeset();
        }

        function showGrid() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('grid-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        const grid = document.getElementById('cards-grid');
        notes.forEach(note => {
            const div = document.createElement('div');
            div.className = 'grid-card';
            div.onclick = () => showDetail(note.id);
            const imgMatch = note.question.match(/src='(.*?)'/);
            const imgSrc = imgMatch ? imgMatch[1] : '';
            div.innerHTML = `
                <div class=\"card-thumb\"><div class=\"card-id-badge\">#${note.id}</div><img src=\"${imgSrc}\"></div>
                <div class=\"card-content\">
                    <div class=\"card-date\">${note.date}</div>
                    <div class=\"card-title\">${note.title}</div>
                </div>
            `;
            grid.appendChild(div);
        });
    </script>
